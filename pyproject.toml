[project]
name = "lamplighter"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = "MIT"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "DTZ", "T20"]
ignore = [
    "S603", # subprocess without a shell is intended here (git)
    "S607", # git is found via PATH
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ansible_runner", "ansible_runner.*", "apscheduler", "apscheduler.*", "hvac", "hvac.*", "requests", "requests.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# DstSafeCronTrigger subclasses the untyped CronTrigger.
module = ["app.scheduler.trigger"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running compose.dev.yml",
    "slow: waits for real cron firings (minutes); skip with -m \"not slow\"",
]
