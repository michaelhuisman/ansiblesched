# Dev-omgeving. Vereist eerst: scripts/dev-keys.sh
#   podman compose -f compose.dev.yml up -d --build
#   podman compose -f compose.dev.yml run --rm dev pytest tests/integration

x-app: &app
  image: localhost/ansible-scheduler:dev
  build:
    context: .
    target: dev
  environment: &app-env
    SCHED_DATABASE_URL: postgresql+psycopg://scheduler:scheduler@postgres:5432/scheduler
    SCHED_LOG_LEVEL: INFO
    SCHED_PUBLIC_URL: http://localhost:8000
    # Alleen dev: de sink hieronder. Echte webhook-URL's zijn secrets.
    SCHED_WEBHOOK_URLS: '["http://webhook-sink:8080/hook"]'
    SCHED_WEBHOOK_SECRET: dev-webhook-secret
    # Dev draait via http; in productie blijft dit true.
    SCHED_SESSION_COOKIE_SECURE: "false"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: docker.io/library/postgres:16
    # Een bevroren (niet gecrashte) leider verliest zijn advisory lock binnen ~15s.
    command:
      - postgres
      - -c
      - tcp_keepalives_idle=5
      - -c
      - tcp_keepalives_interval=5
      - -c
      - tcp_keepalives_count=2
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler # alleen dev
      POSTGRES_DB: scheduler
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"

  api:
    <<: *app
    command: ["api"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *app-env
      # De browser gebruikt localhost:8080 (issuer, login), de api het interne adres.
      SCHED_OIDC_ISSUER: http://localhost:8080/realms/scheduler
      SCHED_OIDC_DISCOVERY_URL: http://keycloak:8080/realms/scheduler/.well-known/openid-configuration
      SCHED_OIDC_CLIENT_ID: ansible-scheduler
    env_file:
      - .dev/secrets/oidc.env # SCHED_OIDC_CLIENT_SECRET, van scripts/dev-keys.sh
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Alleen dev. Realm, clients en testgebruikers uit .dev/keycloak (scripts/dev-keys.sh).
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:8080
      # Token- en JWKS-endpoints volgen het adres van de aanvrager (keycloak:8080).
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    env_file:
      - .dev/secrets/keycloak.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./.dev/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40

  # Draai met --scale scheduler=2 om leader election te testen.
  scheduler:
    <<: *app
    command: ["scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["worker"]
    stop_grace_period: 60s
    environment:
      <<: *app-env
      SCHED_DEV_SECRETS_DIR: /secrets
      SCHED_ANSIBLE_HOST_KEY_CHECKING: "false"
      SCHED_POLL_INTERVAL_S: "1"
      # De fixture-repo is door een andere container aangemaakt.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    volumes:
      - runtime:/run/scheduler
      - fixtures:/fixtures:ro
      - ./.dev/secrets:/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      fixture-repo:
        condition: service_completed_successfully
      ssh-target:
        condition: service_started

  # Bouwt een bare git-repo uit tests/fixtures/repo in het fixtures-volume.
  fixture-repo:
    <<: *app
    depends_on: {}
    entrypoint: ["sh", "/src/scripts/build-fixture-repo.sh", "/src/tests/fixtures/repo", "/fixtures/repo.git"]
    volumes:
      - fixtures:/fixtures
      - ./scripts:/src/scripts:ro
      - ./tests/fixtures:/src/tests/fixtures:ro
    restart: "no"

  ssh-target:
    build:
      context: dev/ssh-target
    volumes:
      - ./.dev/secrets/ssh-target/id_ed25519.pub:/authorized_keys:ro

  # Ontvangt webhooks; tests lezen /received en kunnen fouten forceren via /fail.
  webhook-sink:
    image: docker.io/library/python:3.12-slim
    command: ["python", "/sink/server.py"]
    volumes:
      - ./dev/webhook-sink:/sink:ro

  # Tooling en tests: podman compose -f compose.dev.yml run --rm dev <cmd>
  dev:
    <<: *app
    profiles: ["tools"]
    user: "0"
    command: ["bash"]
    entrypoint: []
    working_dir: /src
    environment:
      <<: *app-env
      SCHED_IT_API_URL: http://api:8000
      SCHED_IT_WEBHOOK_SINK: http://webhook-sink:8080
      SCHED_IT_KEYCLOAK: http://keycloak:8080
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    volumes:
      - .:/src
      - runtime:/run/scheduler:ro
      - fixtures:/fixtures:ro
      - ./.dev/secrets:/secrets:ro

volumes:
  pgdata:
  fixtures:
  # tmpfs, gedeeld tussen workers (en read-only met `dev` voor de cleanup-tests).
  runtime:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=512m,uid=10001,gid=10001,mode=0700"
