[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
hooks = ruff_fix, ruff_format, chmod
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
# Alembic schrijft revisies als 0600; het image leest ze als andere gebruiker.
chmod.type = exec
chmod.executable = chmod
chmod.options = 0644 REVISION_SCRIPT_FILENAME
