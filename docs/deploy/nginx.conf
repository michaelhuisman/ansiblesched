# Example nginx config for lamplighter behind the existing nginx on the host.
# Reference only: the Ansible role does not install or manage nginx.
#
# - TLS terminates here; lamplighter itself speaks plain http on 127.0.0.1:8000
#   (lamplighter_api_bind).
# - LAMPLIGHTER_TRUSTED_PROXIES must be the address nginx's requests arrive from inside
#   the container. Via the published port that is the gateway of the compose network:
#   172.30.117.1 by default (lamplighter_network_gateway), which is also the role default.
# - Replace lamplighter.example.org, the certificate paths and the monitoring CIDR.

# Rate limit for the login form: 10 attempts per minute per client IP (on top of the
# per-account lockout in the app).
limit_req_zone $binary_remote_addr zone=lamplighter_login:10m rate=10r/m;

upstream lamplighter {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name lamplighter.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lamplighter.example.org;

    ssl_certificate     /etc/ssl/lamplighter/fullchain.pem;
    ssl_certificate_key /etc/ssl/lamplighter/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    # Overwrite, don't append: the app trusts exactly one hop (this nginx).
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://lamplighter;
    }

    # Live logs (Server-Sent Events): no buffering, long read timeout.
    location ~ ^/api/v1/runs/[0-9]+/stream$ {
        proxy_pass http://lamplighter;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /ui/login {
        limit_req zone=lamplighter_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://lamplighter;
    }

    # Prometheus only from monitoring; LAMPLIGHTER_METRICS_TOKEN is still required.
    location = /metrics {
        allow 10.0.0.0/24;   # monitoring network
        deny all;
        proxy_pass http://lamplighter;
    }
}
