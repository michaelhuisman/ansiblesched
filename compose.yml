# Productie (minimaal; wordt in fase 5 afgemaakt). Vereist in .env:
#   SCHED_IMAGE, POSTGRES_PASSWORD, SCHED_PUBLIC_URL, SCHED_OPENBAO_ADDR
# Per rol een eigen AppRole via een env-bestand (niet in git):
#   secrets/worker.env     SCHED_OPENBAO_ROLE_ID, SCHED_OPENBAO_SECRET_ID (sched-worker)
#   secrets/scheduler.env  SCHED_OPENBAO_ROLE_ID, SCHED_OPENBAO_SECRET_ID (sched-scheduler)
# OpenBao zelf draait extern. Policies: zie docs/plan.md (Fase 4b).

x-app: &app
  image: ${SCHED_IMAGE:?set SCHED_IMAGE}
  restart: unless-stopped
  environment: &app-env
    SCHED_DATABASE_URL: postgresql+psycopg://scheduler:${POSTGRES_PASSWORD:?}@postgres:5432/scheduler
    SCHED_LOG_LEVEL: INFO
    SCHED_PUBLIC_URL: ${SCHED_PUBLIC_URL:?}
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: docker.io/library/postgres:16
    # Een bevroren (niet gecrashte) leider verliest zijn advisory lock binnen ~15s.
    command:
      - postgres
      - -c
      - tcp_keepalives_idle=5
      - -c
      - tcp_keepalives_interval=5
      - -c
      - tcp_keepalives_count=2
    restart: unless-stopped
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: scheduler
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ${SCHED_IMAGE:?set SCHED_IMAGE}
    command: ["migrate"]
    restart: "no"
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["api"]
    ports:
      - "127.0.0.1:8000:8000"

  scheduler:
    <<: *app
    command: ["scheduler"]
    environment:
      <<: *app-env
      SCHED_OPENBAO_ADDR: ${SCHED_OPENBAO_ADDR:?}
      SCHED_WEBHOOK_OPENBAO_PATH: ${SCHED_WEBHOOK_OPENBAO_PATH:-}
    env_file:
      - secrets/scheduler.env

  worker:
    <<: *app
    command: ["worker"]
    stop_grace_period: 1h
    environment:
      <<: *app-env
      SCHED_OPENBAO_ADDR: ${SCHED_OPENBAO_ADDR:?}
    env_file:
      - secrets/worker.env
    tmpfs:
      - /run/scheduler:size=1g,uid=10001,gid=10001,mode=0700
    volumes:
      - repocache:/var/cache/scheduler/repos

volumes:
  pgdata:
  repocache:
