# Productie (minimaal; wordt in fase 5 afgemaakt). Vereist in .env:
#   LAMPLIGHTER_IMAGE, POSTGRES_PASSWORD, LAMPLIGHTER_PUBLIC_URL, LAMPLIGHTER_OPENBAO_ADDR
# Per rol een eigen AppRole via een env-bestand (niet in git):
#   secrets/worker.env     LAMPLIGHTER_OPENBAO_ROLE_ID, LAMPLIGHTER_OPENBAO_SECRET_ID (lamplighter-worker)
#   secrets/scheduler.env  LAMPLIGHTER_OPENBAO_ROLE_ID, LAMPLIGHTER_OPENBAO_SECRET_ID (lamplighter-scheduler)
# OpenBao zelf draait extern. Policies: zie docs/plan.md (Fase 4b).

name: lamplighter # containers en volumes: lamplighter-<service>, lamplighter_<volume>

x-app: &app
  image: ${LAMPLIGHTER_IMAGE:?set LAMPLIGHTER_IMAGE}
  restart: unless-stopped
  environment: &app-env
    LAMPLIGHTER_DATABASE_URL: postgresql+psycopg://lamplighter:${POSTGRES_PASSWORD:?}@postgres:5432/lamplighter
    LAMPLIGHTER_LOG_LEVEL: INFO
    LAMPLIGHTER_PUBLIC_URL: ${LAMPLIGHTER_PUBLIC_URL:?}
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: docker.io/library/postgres:18.6
    # Een bevroren (niet gecrashte) leider verliest zijn advisory lock binnen ~15s.
    command:
      - postgres
      - -c
      - tcp_keepalives_idle=5
      - -c
      - tcp_keepalives_interval=5
      - -c
      - tcp_keepalives_count=2
    restart: unless-stopped
    environment:
      POSTGRES_USER: lamplighter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: lamplighter
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lamplighter -d lamplighter"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ${LAMPLIGHTER_IMAGE:?set LAMPLIGHTER_IMAGE}
    command: ["migrate"]
    restart: "no"
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["api"]
    ports:
      - "127.0.0.1:8000:8000"

  scheduler:
    <<: *app
    command: ["scheduler"]
    environment:
      <<: *app-env
      LAMPLIGHTER_OPENBAO_ADDR: ${LAMPLIGHTER_OPENBAO_ADDR:?}
      LAMPLIGHTER_WEBHOOK_OPENBAO_PATH: ${LAMPLIGHTER_WEBHOOK_OPENBAO_PATH:-}
    env_file:
      - secrets/scheduler.env

  worker:
    <<: *app
    command: ["worker"]
    stop_grace_period: 1h
    environment:
      <<: *app-env
      LAMPLIGHTER_OPENBAO_ADDR: ${LAMPLIGHTER_OPENBAO_ADDR:?}
    env_file:
      - secrets/worker.env
    tmpfs:
      - /run/lamplighter:size=1g,uid=10001,gid=10001,mode=0700
    volumes:
      - repocache:/var/cache/lamplighter/repos

volumes:
  pgdata:
  repocache:
