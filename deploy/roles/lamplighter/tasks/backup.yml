---
- name: Install the backup service and timer
  ansible.builtin.template:
    src: "lamplighter-backup.{{ item }}.j2"
    dest: "/etc/systemd/system/lamplighter-backup.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  notify: Reload systemd
  when: lamplighter_backup_enabled

- name: Reload systemd now, so the timer can be started
  ansible.builtin.meta: flush_handlers

- name: Enable the backup timer
  ansible.builtin.systemd_service:
    name: lamplighter-backup.timer
    enabled: true
    state: started
  when: lamplighter_backup_enabled

- name: Disable the backup timer
  ansible.builtin.systemd_service:
    name: lamplighter-backup.timer
    enabled: false
    state: stopped
  when:
    - not lamplighter_backup_enabled
    - ansible_facts.service_mgr == 'systemd'
  failed_when: false
